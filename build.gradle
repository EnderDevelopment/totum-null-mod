plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group = 'com.example.mod'
version = '1.0.0'
archivesBaseName = 'totum_of_null'

repositories {
    mavenCentral()
    maven {
        name = 'forge'
        url = "https://files.minecraftforge.net/maven"
    }
}

ext.dependsOn 'clean'

sourceCompatibility = JavaVersion.VERSION_17

def mod_version = project.property('mod_version')
def minecraft_version = project.property('minecraft_version')
def forge_version = project.property('forge_version')

ext.minecraft {
    version = minecraft_version
    mappings channel: 'official', version: '1.18.2'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
        }
        server {
            workingDirectory project.file('run')
        }
        data {
            workingDirectory project.file('run')
        }
    }
}

dependencies {
    implementation fg.deobf('com.mojang:patchy:2.2.11')
    implementation fg.deobf('org.ow2.asm:asm:9.2')
    implementation fg.deobf('org.ow2.asm:asm-commons:9.2')
    implementation fg.deobf('org.ow2.asm:asm-tree:9.2')
    implementation fg.deobf('org.ow2.asm:asm-analysis:9.2')
    implementation fg.deobf('net.minecraftforge:forge:${minecraft_version}-${forge_version}')
}